name: Bug report
description: Something is spoken wrong, not spoken, or fails to install.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove anything private (paths, your ntfy topic, spoken text you
        would rather not share) from the output below.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      multiple: true
      options:
        - Claude Code
        - Codex
        - Google Antigravity
        - Another MCP client
        - Command line only
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Voice MCP (`voice-mcp version`), Node.js (`node --version`), and the host version.
      placeholder: voice-mcp 0.5.0, Node 22.12.0, Claude Code 2.x
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: voice-mcp doctor output
      description: Run `node <plugin>/dist/voice-mcp.mjs doctor` and paste the output.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: The log file path is shown by `voice-mcp paths`.
      render: text
