name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [22, 24]
        include:
          # Newest Node.js; the matrix above starts at the oldest supported (package.json engines).
          - os: ubuntu-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install espeak-ng (Linux system voice)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Bundle, manifests, and changelog are in sync
        run: node scripts/check-dist.mjs

      - name: CLI smoke test
        shell: bash
        env:
          VOICE_MCP_HOME: ${{ runner.temp }}/voice-mcp-home
        run: |
          node plugin/dist/voice-mcp.mjs version
          node plugin/dist/voice-mcp.mjs paths
          node plugin/dist/voice-mcp.mjs doctor || true
          node plugin/dist/voice-mcp.mjs voices --provider system
